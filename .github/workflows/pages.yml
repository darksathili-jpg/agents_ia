name: ORCHESTRA — tests et publication contrôlée
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Pour publier, saisir PUBLIER (validation humaine explicite)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  verification:
    name: Vérifier avant toute publication
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Installer le nécessaire pour les tests
        run: python -m pip install pytest pillow
      - name: Exécuter les tests Première et Terminale
        run: python -m pytest -q premiere/tests tests qa_enseignant/test_redressement.py qa_enseignant/test_variantes.py qa_enseignant/test_visualiseur_bfs.py
      - name: Contrôler l'indentation et JavaScript
        run: |
          node premiere/tests/editor_indent.test.cjs
          for src in shared/editor-indent.js premiere/app.js premiere/python-worker.js premiere/hero-motion.js terminale/app.js terminale/python-worker.js terminale/hero-motion.js terminale/bfs-visualizer.js terminale/demo-bfs.js; do node --check "$src"; done
      - name: Tester la liste blanche de publication, sans les binaires
        run: |
          python scripts/build_site.py --allow-cdn
          python -m pytest -q tests/test_publication.py

  publier:
    name: Publication après décision humaine
    needs: verification
    if: github.event_name == 'workflow_dispatch' && inputs.confirmation == 'PUBLIER' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Vérifier les binaires Pyodide et construire le site public
        run: python scripts/build_site.py --require-local-pyodide
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publier après les contrôles
        id: deployment
        uses: actions/deploy-pages@v4
