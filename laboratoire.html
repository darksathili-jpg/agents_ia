<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Laboratoire U01.1 — Microduck</title><link rel="stylesheet" href="u01-laboratoire.css"><script src="laboratoire-moteur.js" defer></script><script src="u01-laboratoire.js" defer></script></head><body class="light"><a class="skip" href="#contenu-laboratoire">Aller au laboratoire</a><main id="contenu-laboratoire" tabindex="-1"><header class="lab-nav"><a href="u01.html#essai">Retour à U01.1</a><label>Affichage <select id="display"><option value="light">Clair</option><option value="dark">Sombre</option><option value="projector">Vidéoprojecteur</option></select></label></header><div id="navigation-lab"><h1>Microduck — deux tentatives</h1><label for="policy">Politique :</label><select id="policy"><option value="naive">Gloutonne (axe horizontal prioritaire)</option></select><div class="arena"><div id="grid" class="grid" role="img" aria-label="Grille de sept colonnes et cinq lignes ; sur la rangée étudiée, A (0,2), B (1,2), C mur (2,2), D (3,2), E (4,2), F (5,2), G arrivée (6,2)"></div><div class="stats"><div><span>Position actuelle</span><b id="position">0,2</b></div><div><span>Décisions prises</span><b id="steps">0</b></div><div><span>État</span><b id="state" role="status">Prêt</b></div><div><span>Dernière observation</span><span id="observation"></span></div></div></div><div class="controls"><button id="step">Exécuter une étape →</button><button id="reset">Réinitialiser</button></div><h2>Trace pédagogique</h2><div id="log" class="trace" role="log" tabindex="0" aria-live="polite"></div></div><section id="python-panel" hidden><h1>Python — la porte de Nora</h1><label for="code">Éditeur Python — exemple du parcours enseignant</label><textarea id="code" spellcheck="false" rows="25">def appliquer_porte(position, porte, commande):
    if position not in (&quot;hall&quot;, &quot;bureau&quot;):
        raise ValueError(&quot;Position inconnue&quot;)
    if porte not in (&quot;fermée&quot;, &quot;ouverte&quot;):
        raise ValueError(&quot;État de porte inconnu&quot;)
    if commande != &quot;AVANCER&quot;:
        raise ValueError(&quot;Commande inconnue&quot;)
    if position == &quot;hall&quot; and porte == &quot;ouverte&quot;:
        return &quot;bureau&quot;, porte
    return position, porte


# Chaque ligne donne : position avant, porte avant, état après attendu.
cas = [
    (&quot;hall&quot;, &quot;fermée&quot;, (&quot;hall&quot;, &quot;fermée&quot;)),
    (&quot;hall&quot;, &quot;ouverte&quot;, (&quot;bureau&quot;, &quot;ouverte&quot;)),
    (&quot;bureau&quot;, &quot;fermée&quot;, (&quot;bureau&quot;, &quot;fermée&quot;)),
    (&quot;bureau&quot;, &quot;ouverte&quot;, (&quot;bureau&quot;, &quot;ouverte&quot;)),
]
for position, porte, attendu in cas:
    resultat = appliquer_porte(position, porte, &quot;AVANCER&quot;)
    assert resultat == attendu
    print((position, porte), &quot;AVANCER -&gt;&quot;, resultat)
</textarea><div class="controls"><button id="py-run">Exécuter Python</button><button id="py-reset">Restaurer l’exemple de la porte</button><button id="py-stop">Stop Python</button></div><p id="py-status" role="status">Non chargé</p><h2>Console Python</h2><pre id="py-output" class="trace" tabindex="0" aria-live="polite">Le code sera exécuté uniquement à votre demande.</pre></section><div hidden><button id="run">Exécution auto</button><button id="check">Vérifier</button><p id="feedback"></p><p id="explain"></p><span id="statuspill"></span></div></main></body></html>
